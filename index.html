<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Resume Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Automated Resume Builder</h1>

    <form id="resumeForm">
        <input type="text" id="name" placeholder="Full Name" required>
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="text" id="phone" placeholder="Phone Number" required>
        <input type="text" id="linkedin" placeholder="LinkedIn Profile URL">
        <textarea id="education" placeholder="Education Details"></textarea>
        <textarea id="skills" placeholder="Skills"></textarea>
        <textarea id="experience" placeholder="Experience"></textarea>
        <textarea id="projects" placeholder="Projects"></textarea>

        <button type="button" onclick="generateResume()">Generate Resume</button>
    </form>

    <div id="resumeOutput"></div>
</div>

<script src="script.js"></script>
</body>
</html>
